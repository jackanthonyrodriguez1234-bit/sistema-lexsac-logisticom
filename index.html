<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Identificación Digital</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 100%; max-width: 410px; overflow: hidden; display: none; padding-bottom: 25px; }
        .header-bg { background: #0A2540; color: white; text-align: center; padding: 30px 20px 80px 20px; }
        .logo-empresa { height: 50px; background: white; padding: 8px; border-radius: 8px; margin-bottom: 10px; }
        .titulo { font-size: 1.5rem; font-weight: 800; margin: 0; color: white; }
        .foto-container { width: 130px; height: 130px; margin: -65px auto 15px auto; }
        .foto-perfil { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid white; background-color: white; }
        .info-principal { text-align: center; padding: 0 20px; }
        .tag-area { display: inline-block; background-color: #f1f5f9; color: #4a5568; padding: 6px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 20px; }
        .seccion-datos { padding: 0 20px; margin-bottom: 15px; }
        .seccion-titulo { font-size: 0.7rem; font-weight: 700; color: #718096; text-transform: uppercase; margin-bottom: 8px; }
        .bloque-gris { background-color: #F8F9FA; border-radius: 15px; padding: 15px; }
        .grid-2 { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .dato-label { font-size: 0.65rem; color: #a0aec0; text-transform: uppercase; }
        .dato-valor { font-size: 0.85rem; color: #2d3748; font-weight: 700; }
        .mtc-box { padding: 0 20px; margin-top: 15px; text-align: center; }
        .btn-mtc { display: none; background-color: #e53e3e; color: white; text-decoration: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; }
        .error-msg { color: #e53e3e; display: none; font-weight: bold; background: white; padding: 25px; border-radius: 15px; text-align: center; }
    </style>
</head>
<body>

    <div id="errorCard" class="error-msg">Trabajador no encontrado.</div>
    <div id="personalCard" class="card">
        <div class="header-bg">
            <img id="logoEmpresa" src="" alt="Logo" class="logo-empresa"><br>
            <h1 class="titulo">FICHA DE IDENTIFICACIÓN</h1>
        </div>
        <div class="foto-container"><img id="userFoto" src="" alt="Foto" class="foto-perfil"></div>
        <div class="info-principal">
            <h2 id="nombreTxt"></h2>
            <span id="areaTxt" class="tag-area"></span>
        </div>
        <div class="seccion-datos">
            <div class="seccion-titulo">Datos de Identidad</div>
            <div class="bloque-gris">
                <div class="grid-2">
                    <div class="dato-item"><div class="dato-label">DNI</div><div id="dniTxt" class="dato-valor"></div></div>
                    <div class="dato-item"><div class="dato-label">Nacimiento</div><div id="nacimientoTxt" class="dato-valor"></div></div>
                </div>
                <div class="dato-label">Correo</div><div id="correoTxt" class="dato-valor"></div>
            </div>
        </div>
        <div id="bloqueMTC" class="seccion-datos" style="display: none;">
            <div class="seccion-titulo">Registro MTC</div>
            <div class="bloque-gris">
                <div class="grid-2">
                    <div class="dato-item"><div class="dato-label">N° Licencia</div><div id="licenciaTxt" class="dato-valor"></div></div>
                    <div class="dato-item"><div class="dato-label">Categoría</div><div id="categoriaTxt" class="dato-valor"></div></div>
                </div>
            </div>
            <div class="mtc-box"><a id="linkPDF" href="#" target="_blank" class="btn-mtc">VER DOCUMENTO MTC</a></div>
        </div>
    </div>

    <script>
        // Aquí va tu base de datos completa que ya definimos antes...
        const personal = [
            /* (Insertar aquí el bloque de 'personal' que ya tienes) */
        ];

        function inicializarSistema() {
            const params = new URLSearchParams(window.location.search);
            const dniCapturado = params.get('dni');
            if (!dniCapturado) { document.getElementById('errorCard').style.display = "block"; return; }
            const empleado = personal.find(p => p.dni === dniCapturado.trim());
            if (empleado) {
                document.getElementById('personalCard').style.display = "block";
                document.getElementById('nombreTxt').innerText = empleado.nombre;
                document.getElementById('areaTxt').innerText = empleado.area;
                document.getElementById('dniTxt').innerText = empleado.dni;
                document.getElementById('nacimientoTxt').innerText = empleado.nacimiento;
                document.getElementById('correoTxt').innerText = empleado.correo;
                document.getElementById('logoEmpresa').src = (empleado.empresa === "LEXSAC") ? "LEXSAC.png" : "LOGISTICOM.png";
                document.getElementById('userFoto').src = "FOTOS/" + empleado.dni + ".jpg";
                if (empleado.area.toLowerCase().includes("conductor")) {
                    document.getElementById('bloqueMTC').style.display = "block";
                    document.getElementById('linkPDF').style.display = "inline-block";
                    document.getElementById('licenciaTxt').innerText = empleado.licencia;
                    document.getElementById('categoriaTxt').innerText = empleado.categoria;
                    document.getElementById('linkPDF').href = "PDFS/" + empleado.dni + ".pdf";
                }
            } else { document.getElementById('errorCard').style.display = "block"; }
        }
        window.onload = inicializarSistema;
    </script>
</body>
</html>
