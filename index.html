    <style>
        body { font-family: sans-serif; background: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        .error { color: #e53e3e; font-weight: bold; }
        .info { text-align: left; margin-top: 20px; }
        .campo { margin-bottom: 15px; }
        .label { font-size: 0.8rem; color: #718096; text-transform: uppercase; }
        .valor { font-size: 1.1rem; font-weight: bold; color: #2d3748; }
    </style>
</head>
